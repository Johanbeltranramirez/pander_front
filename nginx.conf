server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Para el probe de Kubernetes
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Archivos subidos (CV, anexos). El backend los guarda en un volumen compartido
    # y NGINX los sirve de solo lectura desde ahí (Django no los sirve con DEBUG=False).
    location /media/ {
        alias /usr/share/nginx/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
    }

    # Archivos con hash en el nombre: se pueden cachear mucho tiempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: cualquier ruta que no sea un archivo devuelve index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
