apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pander
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull      # opcional (solo si GHCR es privado)
      containers:
        - name: frontend
          image: ghcr.io/johanbeltranramirez/pander-front:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: media
              mountPath: /usr/share/nginx/media
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: pander-media
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pander
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
